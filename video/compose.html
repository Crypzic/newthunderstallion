<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Thunder Stallion explainer — composition</title>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; overflow: hidden; background: #07080c; perspective: 1800px; transform-style: preserve-3d; }
  #stage * { box-sizing: border-box; }
  .abs { position: absolute; left: 0; top: 0; will-change: transform, opacity; }
  .layer { position: absolute; inset: 0; }
  img { display: block; user-select: none; }
  /* backdrop */
  #grid { inset: -112px; background-image:
      linear-gradient(rgb(255 210 63 / .10) 1px, transparent 1px), linear-gradient(90deg, rgb(255 210 63 / .10) 1px, transparent 1px),
      linear-gradient(rgb(255 255 255 / .05) 1px, transparent 1px), linear-gradient(90deg, rgb(255 255 255 / .05) 1px, transparent 1px);
    background-size: 224px 224px, 224px 224px, 56px 56px, 56px 56px; }
  #grid-mask { inset: 0; background: radial-gradient(120% 90% at 50% 40%, transparent 30%, #07080c 85%); }
  .aurora { inset: -30%; }
  #floor { left: -50%; right: -50%; bottom: -8%; height: 46%;
    background-image: linear-gradient(rgb(255 210 63 / .25) 1px, transparent 1px), linear-gradient(90deg, rgb(91 140 255 / .25) 1px, transparent 1px);
    background-size: 64px 64px; transform: perspective(520px) rotateX(62deg); transform-origin: bottom;
    -webkit-mask-image: linear-gradient(to top, black 5%, transparent 80%); mask-image: linear-gradient(to top, black 5%, transparent 80%); opacity: .55; }
  .bolt { overflow: visible; }
  .bolt path { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 900; }
  .bolt .glow { stroke: #ffe066; stroke-width: 4; filter: drop-shadow(0 0 6px #ffd23f) drop-shadow(0 0 22px #ffd23f); }
  .bolt .core { stroke: #fff; stroke-width: 1.6; }
  .bolt.blue .glow { stroke: #8fb0ff; filter: drop-shadow(0 0 6px #5b8cff) drop-shadow(0 0 20px #5b8cff); }
  #flash { inset: 0; background: radial-gradient(70% 55% at 50% 0%, rgb(255 236 160 / .35), transparent 70%); }
  #vignette { inset: 0; background: radial-gradient(130% 100% at 50% 50%, transparent 55%, rgb(0 0 0 / .55)); pointer-events: none; }
  /* UI pieces */
  .panel { border-radius: 20px; overflow: hidden; background: #0b0d13; border: 1px solid rgb(255 255 255 / .10);
    box-shadow: 0 40px 120px -40px rgb(0 0 0 / .9), 0 0 0 1px rgb(255 210 63 / .08), 0 0 80px -20px rgb(255 210 63 / .25); }
  .shadowed { filter: drop-shadow(0 30px 60px rgb(0 0 0 / .7)) drop-shadow(0 0 40px rgb(255 210 63 / .12)); }
  .sweep { position: absolute; top: 0; bottom: 0; width: 22%; background: linear-gradient(90deg, transparent, rgb(255 255 255 / .55), transparent); mix-blend-mode: overlay; }
  .halo { border-radius: 24px; box-shadow: 0 0 0 2px rgb(255 210 63 / .9), 0 0 50px 8px rgb(255 210 63 / .45); }
  #cursor { width: 34px; height: 34px; filter: drop-shadow(0 4px 10px rgb(0 0 0 / .6)); }
  .ripple { width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%; border: 3px solid #ffd23f; box-shadow: 0 0 24px #ffd23f; }
  #logo { border-radius: 28px; box-shadow: 0 0 0 2px rgb(255 210 63 / .5), 0 0 120px 10px rgb(255 210 63 / .35); }
  #fade { inset: 0; background: #000; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="compose.js"></script>
</body>
</html>
